# Airflow production stack — airflow-server (134.209.96.53)

x-airflow-common: &airflow-common
  image: apache/airflow:3.1.8-python3.12
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR:                    CeleryExecutor
    AIRFLOW__CORE__FERNET_KEY:                  ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES:               "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE:            UTC
    AIRFLOW__CORE__AUTH_MANAGER:                airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:        ${AIRFLOW_METADATA_DSN}
    AIRFLOW__CELERY__BROKER_URL:                redis://redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND:            db+${AIRFLOW_METADATA_DSN}
    AIRFLOW__API__AUTH_BACKENDS:                airflow.api.auth.backend.basic_auth
    AIRFLOW__WEBSERVER__SECRET_KEY:             ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__LOGGING__LOG_LEVEL:                INFO
    # user creation (only consumed by init entrypoint, harmless elsewhere)
    _AIRFLOW_DB_MIGRATE:          "true"
    _AIRFLOW_WWW_USER_CREATE:     "true"
    _AIRFLOW_WWW_USER_USERNAME:   ${AIRFLOW_ADMIN_USER:-admin}
    _AIRFLOW_WWW_USER_PASSWORD:   ${AIRFLOW_ADMIN_PASSWORD:-admin}
    # BigQuery / Warehouse
    BQ_PROJECT:                   ${BQ_PROJECT}
    BQ_DATASET:                   ${BQ_DATASET}
    BQ_CREDENTIALS_PATH:          /opt/airflow/credentials/bigquery-sa.json
    WAREHOUSE_DSN:                ${WAREHOUSE_DSN}
    BQ_CHUNK_ROWS:                ${BQ_CHUNK_ROWS:-50000}
    BQ_INCREMENTAL_LOOKBACK_DAYS: ${BQ_INCREMENTAL_LOOKBACK_DAYS:-3}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/include:/opt/airflow/include
    - ./sql:/opt/airflow/sql
    - ./docker:/opt/airflow/docker
    - ./credentials:/opt/airflow/credentials:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:

  redis:
    image: redis:8.6.1-alpine
    container_name: airflow-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # Uses the official /entrypoint which reads _AIRFLOW_DB_MIGRATE and _AIRFLOW_WWW_USER_CREATE
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - exec /entrypoint airflow version
    restart: on-failure

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    command: celery worker
    environment:
      DUMB_INIT_SETSID: "0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-logs:
  redis-data:
